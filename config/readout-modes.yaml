independent_first:
  label: "独立SPAD · 每周期单次记录"
  description: "每个SPAD独享TDC，每周期最多一个时间戳；SPAD/TDC死时间跨周期保留。"
independent_multi:
  label: "独立SPAD · 多次记录"
  description: "每个SPAD独享TDC，可记录多个时间戳；每个TDC有死时间和每周期存储上限。"
shared_first:
  label: "OR汇合 · 共享TDC单次记录"
  description: "SPAD输出经OR脉冲合并，单TDC每周期最多记录一次。"
shared_multi:
  label: "OR汇合 · 共享TDC多次记录"
  description: "OR合并后，单TDC恢复后可再次记录，受每周期存储上限约束。"
shared_multitdc:
  label: "OR汇合 · 共享多TDC"
  description: "OR输出分配到最先可用的TDC，各TDC独立死时间和存储容量；不是具体芯片的仲裁复刻。"
coincidence_fixed:
  label: "符合检测 · 固定窗口"
  description: "从门起点分段，窗口内不同SPAD数达到阈值后在窗末生成时间戳（最后部分窗取门结束前）。"
coincidence_sliding:
  label: "符合检测 · 滑动窗口"
  description: "SPAD脉冲持续一个符合窗宽，活跃的不同SPAD数向上跨越阈值时触发单共享TDC。"
analytic_reference:
  label: "理想参考 · 首光子解析模型"
  description: "旧版快速模型：每周期重置，各SPAD每发首时间戳全可读。不使用有限死时间/读出限制。"
