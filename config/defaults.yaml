# 工况默认值唯一来源；CSV和手动模式分别保存采样点。
schema_version: 1
simulation:
  range_m: 50
  target_reflectivity: 0.1
  wavelength_nm: 940
  pulse_energy_nj: 5
  pulse_shape: gaussian
  laser_prf_hz: 1000000
  tx_efficiency: 0.8
  overlap_factor: 1
  atmospheric_one_way_transmission: 0.95
  rx_aperture_shape: circle
  rx_aperture_mm: 20
  rx_aperture_width_mm: 20
  rx_aperture_height_mm: 10
  rx_efficiency: 0.5
  channel_ifov_h_mrad: 0.2
  channel_ifov_v_mrad: 0.2
  solar_enabled: true
  solar_illuminance_lux: 50000
  solar_reflectivity: 0.1
  other_light_enabled: true
  other_light_scale: 1
  spads_per_channel: 16
  fill_factor: 0.2
  dcr_cps_per_spad: 1000
  other_noise_cps_per_spad: 0
  spad_dead_time_ns: 20
  readout_mode: independent_first
  detector_operation: gated
  tdc_dead_time_ns: 10
  tdc_count: 4
  tdc_max_hits_per_cycle: 8
  or_pulse_width_ns: 1
  coincidence_window_ns: 2
  coincidence_threshold: 2
  spad_jitter_fwhm_ps: 150
  pulse_fwhm_ps: 700
  other_jitter_fwhm_ps: 80
  tdc_bin_ps: 100
  gate_start_ns: 0
  gate_width_ns: 700
  calibration_delay_ns: 0
  laser_shots: 100
  monte_carlo_trials: 80
  rng_seed: 7
  line_channels: 16
  nearest_neighbor_crosstalk: 0.005
  crosstalk_decay_channels: 0.8
  spectral_inputs:
    filter:
      mode: basic
      basic:
        shape: rectangle
        amplitude: 0.8
        min_nm: 900
        max_nm: 980
        center_nm: 940
        width_nm: 10
        flat_width_nm: 8
        edge_width_nm: 2
      interpolation: pchip
      csv_points: []
      manual_points: []
      csv_name: ''
    other:
      mode: manual
      basic:
        shape: constant
        amplitude: 0.02
        min_nm: 350
        max_nm: 1200
        center_nm: 940
        width_nm: 100
        flat_width_nm: 80
        edge_width_nm: 20
      interpolation: pchip
      csv_points: []
      manual_points:
      - wavelength_nm: 350
        value: 0
      - wavelength_nm: 450
        value: 0.0005
      - wavelength_nm: 550
        value: 0.001
      - wavelength_nm: 650
        value: 0.0018
      - wavelength_nm: 750
        value: 0.0025
      - wavelength_nm: 850
        value: 0.0035
      - wavelength_nm: 940
        value: 0.004
      - wavelength_nm: 1050
        value: 0.003
      - wavelength_nm: 1200
        value: 0
      csv_name: ''
    pde:
      mode: manual
      basic:
        shape: constant
        amplitude: 0.15
        min_nm: 350
        max_nm: 1200
        center_nm: 700
        width_nm: 400
        flat_width_nm: 200
        edge_width_nm: 100
      interpolation: pchip
      csv_points: []
      manual_points:
      - wavelength_nm: 350
        value: 0
      - wavelength_nm: 400
        value: 0.08
      - wavelength_nm: 450
        value: 0.25
      - wavelength_nm: 550
        value: 0.45
      - wavelength_nm: 650
        value: 0.42
      - wavelength_nm: 750
        value: 0.33
      - wavelength_nm: 850
        value: 0.23
      - wavelength_nm: 905
        value: 0.18
      - wavelength_nm: 940
        value: 0.15
      - wavelength_nm: 1000
        value: 0.08
      - wavelength_nm: 1100
        value: 0
      csv_name: ''
    solar:
      mode: standard
      basic:
        shape: gaussian
        amplitude: 1
        min_nm: 280
        max_nm: 4000
        center_nm: 550
        width_nm: 500
        flat_width_nm: 300
        edge_width_nm: 150
      interpolation: pchip
      csv_points: []
      manual_points: []
      csv_name: ''
