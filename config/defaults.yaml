# 工况默认值唯一来源；CSV和手动模式分别保存采样点。
schema_version: 1
simulation:
  range_m: 100
  target_reflectivity: 0.1
  wavelength_nm: 905
  pulse_energy_nj: 12
  pulse_shape: gaussian
  laser_prf_hz: 100000
  tx_efficiency: 0.8
  overlap_factor: 1
  atmospheric_one_way_transmission: 0.95
  rx_aperture_shape: rectangle
  rx_aperture_mm: 20
  rx_aperture_width_mm: 40
  rx_aperture_height_mm: 20
  rx_efficiency: 0.8
  channel_ifov_h_mrad: 0.2
  channel_ifov_v_mrad: 0.2
  solar_enabled: true
  solar_illuminance_lux: 50000
  solar_reflectivity: 0.1
  other_light_enabled: true
  other_light_scale: 1
  H_binning: 4
  V_binning: 4
  fill_factor: 0.92
  # 用户确认的Sony/IMX459相关工程参考；条件与未映射项见docs/references/sony-reference.md。
  dcr_cps_per_spad: 2007
  other_noise_cps_per_spad: 0
  spad_dead_time_ns: 6
  readout_mode: independent_multi
  detector_operation: gated
  tdc_dead_time_ns: 0  # 暂不研究TDC忙碌限制；理想读出假设，非器件实测值。
  tdc_count: 4
  tdc_max_hits_per_cycle: 1000
  or_pulse_width_ns: 1
  coincidence_window_ns: 2
  coincidence_threshold: 2
  spad_jitter_fwhm_ps: 173
  pulse_fwhm_ps: 2000
  other_jitter_fwhm_ps: 80
  tdc_bin_ps: 1000  # 时间量化间隔，不是SPAD抖动或TDC死时间。
  gate_start_ns: 0
  gate_width_ns: 2048
  calibration_delay_ns: 0
  laser_shots: 1
  monte_carlo_trials: 40
  detection_enabled: true
  detection_target_pfa: 0.05
  rng_seed: 7
  line_channels: 16
  nearest_neighbor_crosstalk: 0.005
  crosstalk_decay_channels: 0.8
  spectral_inputs:
    filter:
      mode: basic
      basic:
        shape: rectangle
        amplitude: 0.95
        out_of_band_transmission: 0
        min_nm: 855
        max_nm: 955
        center_nm: 905
        width_nm: 10
        flat_width_nm: 8
        edge_width_nm: 2
      interpolation: pchip
