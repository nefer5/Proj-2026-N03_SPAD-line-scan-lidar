# Domain experiment additions; shared device/readout/curve defaults reuse simulation above.
experiments:
  # High-level system requirements; independent of the existing small-angle
  # detector reference. These targets do not silently replace a scan program.
  budget:
    reset_time_ns: null
    wall_plug_efficiency: null
    max_average_optical_power_w: null
    max_peak_optical_power_w: null
    prbs_enabled: false
    prbs_chip_count: null
    prbs_chip_ns: null
    prbs_on_count: null
  budget_geometry:
    vfov_deg: null  # 未指定时从当前B默认Tx的V全角折算；解析后显式保存，非硬件实测值。
    tx_h_width_mrad: 2
  system_targets:
    frame_rate_hz: 10
    hfov_deg: 120
    scan_time_utilization: 0.667
    slot_count: 1000
  columns:
    acquisition:
      scope_mode: frame
      scope_first_column: 0
      scope_column_count: 2
      analysis_bin_ps: null
      trial_count: 1
      noise_trial_count: 0
    diagnostics:
      pixel_id: null
      start_ns: null
      end_ns: null
    exposure:
      gate_mode: per_pulse
      pulses:
      - time_offset_ns: 0
        energy_nj: null
      - time_offset_ns: 10000
        energy_nj: null
      - time_offset_ns: 20000
        energy_nj: null
      - time_offset_ns: 30000
        energy_nj: null
      tail_fraction: 0
      tail_tau_ns: null
    transport:
      enabled: false
      buffer_count: 2
      dsp_time_us: null
      dsp_mode: serial
      dsp_initiation_us: null
      mipi_mode: duration
      mipi_time_us: null
      point_bytes: null
      payload_format: points
      histogram_count_bits: null
      event_record_bytes: null
      column_header_bytes: null
      mipi_net_mbps: null
      overflow_policy: drop_column
  spad:
    illumination:
      signal_photons_per_pulse: 20
      background_photons_per_second_per_pixel: 10000
      pulse_delay_ns: 600
      spatial_mode: uniform
      pixel_weights: []
  system:
    acquisition:
      monte_carlo_trials: 10
    tx:
      pulse_average_power_w: 280  # 全Tx角域、VCSEL出光/Tx光学前；E=P×FWHM等效时长。
      tx_model: gaussian
      tx_fwhm_h_mrad: 8
      tx_fwhm_v_mrad: 3
      tx_order_h: 2
      tx_order_v: 2
      tx_center_h_mrad: 0
      tx_center_v_mrad: 0
      angle_h_min_mrad: -6
      angle_h_max_mrad: 6
      angle_v_min_mrad: -3
      angle_v_max_mrad: 3
    rx:
      rx_model: gaussian_psf
      dataset: null
      focal_length_h_mm: 20
      focal_length_v_mm: 20
      mapping_mode: inverted
      psf_sigma_h_um: 8
      psf_sigma_v_um: 8
      psf_order_h: 2
      psf_order_v: 2
      rx_offset_x_um: 0
      rx_offset_y_um: 0
      rx_angle_h_min_mrad: -6
      rx_angle_h_max_mrad: 6
      rx_angle_v_min_mrad: -3
      rx_angle_v_max_mrad: 3
    spad:
      channels_h: 2
      channels_v: 16
      pixel_pitch_um: 20
  scan:
    scan:
      trajectory: sawtooth
      frame_rate_hz: 1000
      frame_count: 1
      active_fraction: 0.8
      mechanical_start_mrad: -10
      mechanical_end_mrad: 10
      optical_multiplier: 2
      optical_offset_mrad: 0
      phase_offset_ns: 0
      laser_time_offset_ns: 0
      laser_jitter_std_ns: 0
      encoder_latency_ns: 0
      encoder_angle_offset_mrad: 0
      rx_scan_scale: 1
      rx_angle_offset_mrad: 0
      emission_policy: active_only
      reconstruct_flyback: false
      angle_bin_min_mrad: -20
      angle_bin_max_mrad: 20
      angle_bin_width_mrad: 2
      channel_direction_mode: optical_centroid
      channel_h_mrad: []
      channel_v_mrad: []
    scene_motion:
      range_gradient_m_per_rad: 0
      radial_velocity_m_s: 0

  # Named optional experiment, never an implicit override of shared defaults.
  scan_demo:
    background:
      solar_enabled: false
      other_light_enabled: false
