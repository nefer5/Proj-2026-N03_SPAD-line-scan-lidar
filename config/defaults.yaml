# 工况默认值唯一来源；CSV和手动模式分别保存采样点。
schema_version: 1
simulation:
  range_m: 50
  target_reflectivity: 0.1
  wavelength_nm: 905
  pulse_energy_nj: 5
  pulse_shape: gaussian
  laser_prf_hz: 1000000
  tx_efficiency: 0.8
  overlap_factor: 1
  atmospheric_one_way_transmission: 0.95
  rx_aperture_shape: circle
  rx_aperture_mm: 20
  rx_aperture_width_mm: 20
  rx_aperture_height_mm: 10
  rx_efficiency: 0.5
  channel_ifov_h_mrad: 0.2
  channel_ifov_v_mrad: 0.2
  solar_enabled: true
  solar_illuminance_lux: 50000
  solar_reflectivity: 0.1
  other_light_enabled: true
  other_light_scale: 1
  H_binning: 4
  V_binning: 4
  fill_factor: 0.92
  dcr_cps_per_spad: 1000
  other_noise_cps_per_spad: 0
  spad_dead_time_ns: 20
  readout_mode: independent_first
  detector_operation: gated
  tdc_dead_time_ns: 10
  tdc_count: 4
  tdc_max_hits_per_cycle: 8
  or_pulse_width_ns: 1
  coincidence_window_ns: 2
  coincidence_threshold: 2
  spad_jitter_fwhm_ps: 150
  pulse_fwhm_ps: 700
  other_jitter_fwhm_ps: 80
  tdc_bin_ps: 100
  gate_start_ns: 0
  gate_width_ns: 700
  calibration_delay_ns: 0
  laser_shots: 100
  monte_carlo_trials: 80
  rng_seed: 7
  line_channels: 16
  nearest_neighbor_crosstalk: 0.005
  crosstalk_decay_channels: 0.8
  spectral_inputs:
    filter:
      mode: basic
      basic:
        shape: rectangle
        amplitude: 0.95
        min_nm: 855
        max_nm: 955
        center_nm: 905
        width_nm: 10
        flat_width_nm: 8
        edge_width_nm: 2
      interpolation: pchip
      csv_points: []
      manual_points: []
      csv_name: ''
    other:
      mode: manual
      basic:
        shape: constant
        amplitude: 0.02
        min_nm: 350
        max_nm: 1200
