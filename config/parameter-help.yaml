    label: 构造Rx覆盖 H min
    unit: mrad
    description: 仅构造Rx模型生效，与Tx角域独立；Rx使用此角域采样数据库，禁止超域外推。导入Rx时使用文件轴。
  optics.rx_angle_h_max_mrad:
    label: 构造Rx覆盖 H max
    unit: mrad
    description: 仅构造Rx模型生效，与Tx角域独立；Rx使用此角域采样数据库，禁止超域外推。导入Rx时使用文件轴。
  optics.rx_angle_v_min_mrad:
    label: 构造Rx覆盖 V min
    unit: mrad
    description: 仅构造Rx模型生效，与Tx角域独立；Rx使用此角域采样数据库，禁止超域外推。导入Rx时使用文件轴。
  optics.rx_angle_v_max_mrad:
