<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPAD · 模块化研究台</title>
<link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/shared/labs.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css"></head>
<body data-lab="__KIND__">
<header><div><p class="eyebrow">PHYSICS LAB / SHARED DETECTOR CORE</p><h1 id="title">SPAD 研究台</h1><p class="lede" id="subtitle">直接设定探测面入射光，研究器件与读出。</p></div>
<nav class="toolbar"><a href="/spad">SPAD 研究</a><a href="/system">整机仿真</a><a href="/">A 单通道</a><a href="/debug">A 专家调试</a></nav></header>
<main class="lab-layout"><aside class="panel controls">
<div class="toolbar"><button class="primary" id="runLab">提交仿真</button><button id="resetLab">恢复默认</button></div>
<div class="toolbar"><button id="exportConfig">导出配置</button><label class="file-button">导入配置<input id="importConfig" type="file" accept=".json,.yaml,.yml"></label></div>
<p id="formStatus" role="status"></p><div id="fields"></div><div id="curves"></div>
</aside><section class="lab-results">
<div id="error" role="alert" class="lab-error hidden"></div>
<section class="panel lab-card"><div class="card-heading"><h2>运行任务</h2><button id="refreshJobs">刷新任务</button></div><p class="muted">任务持续在后台运行。刷新页面后可继续查看。</p><div id="jobs"></div></section>
<section class="panel lab-card" id="resultPanel"><div class="card-heading"><h2>采集结果</h2><button id="exportResult" disabled>导出完整结果</button></div>
<p id="resultStatus" class="muted">提交实验后，查看光子分布、通道直方图和读出损失。</p><div id="metrics" class="metric-grid"></div>
<div class="chart-grid"><div><h3>探测面入射光子 / 发 · PDE/FF 前</h3><canvas id="illuminationPlot"></canvas><p id="planeNote" class="muted"></p></div><div><h3>各通道记录直方图</h3><canvas id="histogramPlot"></canvas><p id="histogramNote" class="muted"></p></div></div>
<div class="toolbar"><label>重放分箱宽度 (ps)<input id="replayBin" type="number" step="any"></label><button id="replay" disabled>使用同一份记录重放</button></div>
<div id="opticalResults"></div><details><summary>专家审计：配置、统计口径与模型限制</summary><pre id="audit"></pre></details>
</section></section></main>
<script src="/static/vendor/katex/katex.min.js"></script><script src="/static/curve-editor.js"></script><script src="/static/shared/labs.js"></script>
</body></html>
