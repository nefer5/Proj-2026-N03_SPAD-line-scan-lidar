<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320"><rect width="1900" height="1320" fill="#0b1118"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="45" y="43" fill="#9bafbe" font-size="15" text-anchor="start">HARDWARE / RESOURCE DEPENDENCIES</text><text x="45" y="100" fill="#e2ebf2" font-size="34" text-anchor="start">固定分工双缓冲 · A采集 / B处理</text><text x="45" y="140" fill="#9bafbe" font-size="19" text-anchor="start">A采集 → 搬到B → 清空A再采下一列；B中的DSP与A采集重叠。三个slot，仅作架构依赖预览。</text><rect x="1540" y="45" width="314" height="43" fill="#1b2b39" stroke="none" stroke-width="0.7"/><text x="1560" y="73" fill="#f4b46d" font-size="19" text-anchor="start">设计预览 · 非当前工况结果</text><rect x="45" y="180" width="431" height="112" fill="#111c27" stroke="#293a49" stroke-width="0.7"/><text x="62" y="209" fill="#9bafbe" font-size="17" text-anchor="start">缓冲分工</text><text x="62" y="248" fill="#e2ebf2" font-size="29" text-anchor="start">A采集 / B处理</text><text x="62" y="276" fill="#9bafbe" font-size="15" text-anchor="start">角色固定，不轮换</text><rect x="500" y="180" width="431" height="112" fill="#111c27" stroke="#293a49" stroke-width="0.7"/><text x="517" y="209" fill="#9bafbe" font-size="17" text-anchor="start">输出FIFO</text><text x="517" y="248" fill="#e2ebf2" font-size="29" text-anchor="start">1 KiB</text><text x="517" y="276" fill="#9bafbe" font-size="15" text-anchor="start">本例只容纳一列结果</text><rect x="955" y="180" width="431" height="112" fill="#111c27" stroke="#293a49" stroke-width="0.7"/><text x="972" y="209" fill="#9bafbe" font-size="17" text-anchor="start">S2采集推迟</text><text x="972" y="248" fill="#e2ebf2" font-size="29" text-anchor="start">45 μs</text><text x="972" y="276" fill="#9bafbe" font-size="15" text-anchor="start">计划160 → 实际205</text><rect x="1410" y="180" width="431" height="112" fill="#111c27" stroke="#293a49" stroke-width="0.7"/><text x="1427" y="209" fill="#9bafbe" font-size="17" text-anchor="start">DSP输出等待</text><text x="1427" y="248" fill="#e2ebf2" font-size="29" text-anchor="start">60 μs</text><text x="1427" y="276" fill="#9bafbe" font-size="15" text-anchor="start">S1和S2均等待FIFO释放</text><rect x="45" y="322" width="1418" height="858" fill="#111c27" stroke="#293a49" stroke-width="0.7"/><rect x="1483" y="322" width="371" height="858" fill="#111c27" stroke="#293a49" stroke-width="0.7"/><text x="66" y="364" fill="#e2ebf2" font-size="23" text-anchor="start">一个代表芯片 · 固定角色A/B + 有限FIFO</text><text x="939" y="364" fill="#9bafbe" font-size="16" text-anchor="start">时间轴一致；实线为依赖，虚线为等待</text><line x1="253.0" y1="423" x2="253.0" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="253.0" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">0</text><line x1="333.90277777777777" y1="423" x2="333.90277777777777" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="414.80555555555554" y1="423" x2="414.80555555555554" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="414.80555555555554" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">100</text><line x1="495.70833333333337" y1="423" x2="495.70833333333337" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="576.6111111111111" y1="423" x2="576.6111111111111" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="576.6111111111111" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">200</text><line x1="657.5138888888889" y1="423" x2="657.5138888888889" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="738.4166666666667" y1="423" x2="738.4166666666667" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="738.4166666666667" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">300</text><line x1="819.3194444444445" y1="423" x2="819.3194444444445" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="900.2222222222223" y1="423" x2="900.2222222222223" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="900.2222222222223" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">400</text><line x1="981.125" y1="423" x2="981.125" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="1062.0277777777778" y1="423" x2="1062.0277777777778" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="1062.0277777777778" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">500</text><line x1="1142.9305555555557" y1="423" x2="1142.9305555555557" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="1223.8333333333335" y1="423" x2="1223.8333333333335" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="1223.8333333333335" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">600</text><line x1="1304.736111111111" y1="423" x2="1304.736111111111" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="1385.638888888889" y1="423" x2="1385.638888888889" y2="965" stroke="#2a3642" stroke-width="0.7" stroke-dasharray="3 6"/><text x="1385.638888888889" y="998" fill="#9bafbe" font-size="16" text-anchor="middle">700</text><text x="65" y="469" fill="#e2ebf2" font-size="19" text-anchor="start">缓存 A · 采集</text><line x1="253" y1="484" x2="1418" y2="484" stroke="#222e39" stroke-width="0.7"/><text x="65" y="534" fill="#e2ebf2" font-size="19" text-anchor="start">A 清空 / 复位</text><line x1="253" y1="549" x2="1418" y2="549" stroke="#222e39" stroke-width="0.7"/><text x="65" y="599" fill="#e2ebf2" font-size="19" text-anchor="start">A → B 搬移</text><line x1="253" y1="614" x2="1418" y2="614" stroke="#222e39" stroke-width="0.7"/><text x="65" y="664" fill="#e2ebf2" font-size="19" text-anchor="start">缓存 B · DSP</text><line x1="253" y1="679" x2="1418" y2="679" stroke="#222e39" stroke-width="0.7"/><text x="65" y="729" fill="#e2ebf2" font-size="19" text-anchor="start">B 输出等待</text><line x1="253" y1="744" x2="1418" y2="744" stroke="#222e39" stroke-width="0.7"/><text x="65" y="794" fill="#e2ebf2" font-size="19" text-anchor="start">输出 FIFO 占位</text><line x1="253" y1="809" x2="1418" y2="809" stroke="#222e39" stroke-width="0.7"/><text x="65" y="859" fill="#e2ebf2" font-size="19" text-anchor="start">MIPI 打包</text><line x1="253" y1="874" x2="1418" y2="874" stroke="#222e39" stroke-width="0.7"/><text x="65" y="924" fill="#e2ebf2" font-size="19" text-anchor="start">MIPI 发送</text><line x1="253" y1="939" x2="1418" y2="939" stroke="#222e39" stroke-width="0.7"/><rect x="382.44444444444446" y="444" width="16.180555555555543" height="34" fill="#222e39" stroke="none" stroke-width="0.7"/><rect x="253.0" y="444" width="129.44444444444446" height="34" fill="#88565c" stroke="none" stroke-width="0.7"/><text x="317.72222222222223" y="470" fill="#e2ebf2" font-size="18" text-anchor="middle">S0</text><rect x="382.44444444444446" y="639" width="177.9861111111111" height="34" fill="#222e39" stroke="none" stroke-width="0.7"/><rect x="398.625" y="509" width="8.090277777777771" height="34" fill="#41706b" stroke="none" stroke-width="0.7"/><rect x="382.44444444444446" y="574" width="16.180555555555543" height="34" fill="#398683" stroke="none" stroke-width="0.7"/><rect x="398.625" y="639" width="161.80555555555554" height="34" fill="#676e94" stroke="none" stroke-width="0.7"/><text x="479.52777777777777" y="664" fill="#e2ebf2" font-size="17" text-anchor="middle">S0</text><rect x="560.4305555555555" y="769" width="275.06944444444446" height="34" fill="#3e6c67" stroke="none" stroke-width="0.7"/><text x="697.9652777777778" y="794" fill="#e2ebf2" font-size="17" text-anchor="middle">S0</text><rect x="560.4305555555555" y="834" width="16.180555555555543" height="34" fill="#997751" stroke="none" stroke-width="0.7"/><rect x="576.6111111111111" y="899" width="258.8888888888889" height="34" fill="#477b73" stroke="none" stroke-width="0.7"/><text x="706.0555555555555" y="924" fill="#e2ebf2" font-size="17" text-anchor="middle">S0</text><line x1="382.44444444444446" y1="478" x2="382.44444444444446" y2="565" stroke="#43756e" stroke-width="0.7"/><line x1="382.44444444444446" y1="565" x2="382.44444444444446" y2="574" stroke="#43756e" stroke-width="0.7"/><line x1="398.625" y1="509" x2="398.625" y2="639" stroke="#68b5a2" stroke-width="0.7"/><line x1="406.71527777777777" y1="444" x2="406.71527777777777" y2="543" stroke="#68b5a2" stroke-width="0.7"/><line x1="560.4305555555555" y1="738" x2="560.4305555555555" y2="769" stroke="#68b5a2" stroke-width="0.7"/><line x1="576.6111111111111" y1="868" x2="576.6111111111111" y2="899" stroke="#68b5a2" stroke-width="0.7"/><rect x="536.1597222222222" y="444" width="40.451388888888914" height="34" fill="#222e39" stroke="none" stroke-width="0.7"/><rect x="406.71527777777777" y="444" width="129.4444444444444" height="34" fill="#3e323b" stroke="none" stroke-width="0.7"/><text x="471.4375" y="470" fill="#e2ebf2" font-size="18" text-anchor="middle">S1</text><rect x="560.4305555555555" y="639" width="275.06944444444446" height="34" fill="#222e39" stroke="none" stroke-width="0.7"/><rect x="576.6111111111111" y="509" width="8.090277777777828" height="34" fill="#243e42" stroke="none" stroke-width="0.7"/><rect x="560.4305555555555" y="574" width="16.180555555555543" height="34" fill="#21464b" stroke="none" stroke-width="0.7"/><rect x="576.6111111111111" y="639" width="161.80555555555566" height="34" fill="#343d53" stroke="none" stroke-width="0.7"/><text x="657.5138888888889" y="664" fill="#e2ebf2" font-size="17" text-anchor="middle">S1</text><rect x="738.4166666666667" y="704" width="97.08333333333326" height="34" fill="#3a3734" stroke="none" stroke-width="0.7"/><text x="786.9583333333334" y="729" fill="#e2ebf2" font-size="17" text-anchor="middle">FIFO满</text><rect x="835.5" y="769" width="275.06944444444434" height="34" fill="#223b40" stroke="none" stroke-width="0.7"/><text x="973.0347222222222" y="794" fill="#e2ebf2" font-size="17" text-anchor="middle">S1</text><rect x="835.5" y="834" width="16.180555555555543" height="34" fill="#4a4238" stroke="none" stroke-width="0.7"/><rect x="851.6805555555555" y="899" width="258.8888888888888" height="34" fill="#274246" stroke="none" stroke-width="0.7"/><text x="981.125" y="924" fill="#e2ebf2" font-size="17" text-anchor="middle">S1</text><line x1="536.1597222222222" y1="478" x2="536.1597222222222" y2="565" stroke="#43756e" stroke-width="0.7"/><line x1="536.1597222222222" y1="565" x2="560.4305555555555" y2="565" stroke="#43756e" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="560.4305555555555" y1="565" x2="560.4305555555555" y2="574" stroke="#43756e" stroke-width="0.7"/><line x1="576.6111111111111" y1="509" x2="576.6111111111111" y2="639" stroke="#68b5a2" stroke-width="0.7"/><line x1="584.7013888888889" y1="444" x2="584.7013888888889" y2="543" stroke="#68b5a2" stroke-width="0.7"/><line x1="835.5" y1="738" x2="835.5" y2="769" stroke="#68b5a2" stroke-width="0.7"/><line x1="851.6805555555555" y1="868" x2="851.6805555555555" y2="899" stroke="#68b5a2" stroke-width="0.7"/><rect x="714.1458333333333" y="444" width="137.53472222222229" height="34" fill="#222e39" stroke="none" stroke-width="0.7"/><text x="782.9131944444443" y="467" fill="#9bafbe" font-size="15" text-anchor="middle">等待 / 搬移</text><rect x="584.7013888888889" y="444" width="129.44444444444434" height="34" fill="#3e323b" stroke="none" stroke-width="0.7"/><text x="649.4236111111111" y="470" fill="#e2ebf2" font-size="18" text-anchor="middle">S2</text><rect x="835.5" y="639" width="275.06944444444434" height="34" fill="#222e39" stroke="none" stroke-width="0.7"/><rect x="851.6805555555555" y="509" width="8.090277777777828" height="34" fill="#243e42" stroke="none" stroke-width="0.7"/><rect x="835.5" y="574" width="16.180555555555543" height="34" fill="#21464b" stroke="none" stroke-width="0.7"/><rect x="851.6805555555555" y="639" width="161.80555555555554" height="34" fill="#343d53" stroke="none" stroke-width="0.7"/><text x="932.5833333333333" y="664" fill="#e2ebf2" font-size="17" text-anchor="middle">S2</text><rect x="1013.4861111111111" y="704" width="97.08333333333326" height="34" fill="#3a3734" stroke="none" stroke-width="0.7"/><text x="1062.0277777777778" y="729" fill="#e2ebf2" font-size="17" text-anchor="middle">FIFO满</text><rect x="1110.5694444444443" y="769" width="275.06944444444457" height="34" fill="#223b40" stroke="none" stroke-width="0.7"/><text x="1248.1041666666665" y="794" fill="#e2ebf2" font-size="17" text-anchor="middle">S2</text><rect x="1110.5694444444443" y="834" width="16.180555555555657" height="34" fill="#4a4238" stroke="none" stroke-width="0.7"/><rect x="1126.75" y="899" width="258.8888888888889" height="34" fill="#274246" stroke="none" stroke-width="0.7"/><text x="1256.1944444444443" y="924" fill="#e2ebf2" font-size="17" text-anchor="middle">S2</text><line x1="714.1458333333333" y1="478" x2="714.1458333333333" y2="565" stroke="#43756e" stroke-width="0.7"/><line x1="714.1458333333333" y1="565" x2="835.5" y2="565" stroke="#43756e" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="835.5" y1="565" x2="835.5" y2="574" stroke="#43756e" stroke-width="0.7"/><line x1="851.6805555555555" y1="509" x2="851.6805555555555" y2="639" stroke="#68b5a2" stroke-width="0.7"/><line x1="1110.5694444444443" y1="738" x2="1110.5694444444443" y2="769" stroke="#68b5a2" stroke-width="0.7"/><line x1="1126.75" y1="868" x2="1126.75" y2="899" stroke="#68b5a2" stroke-width="0.7"/><line x1="560.4305555555555" y1="560" x2="560.4305555555555" y2="804" stroke="#68b5a2" stroke-width="0.7"/><text x="568.4305555555555" y="415" fill="#68b5a2" font-size="16" text-anchor="start">B释放 → 搬移S1</text><line x1="835.5" y1="574" x2="835.5" y2="934" stroke="#43756e" stroke-width="0.7"/><line x1="1110.5694444444443" y1="574" x2="1110.5694444444443" y2="934" stroke="#43756e" stroke-width="0.7"/><text x="843.5" y="1046" fill="#68b5a2" font-size="16" text-anchor="start">FIFO释放 → B结果交付 / 后续搬移</text><line x1="511.88888888888886" y1="435" x2="584.7013888888889" y2="435" stroke="#a57f54" stroke-width="0.7" stroke-dasharray="3 6"/><text x="504.88888888888886" y="423" fill="#f4b46d" font-size="15" text-anchor="start">S2延后45 μs</text><text x="1270" y="1100" fill="#9bafbe" font-size="17" text-anchor="start">时间 / μs</text><text x="68" y="1146" fill="#9bafbe" font-size="17" text-anchor="start">浅灰 = 缓存数据保留；黄色 = FIFO满导致B仍被占用。A等待B可写才搬移，搬移/清空后才采下一列。</text><text x="1503" y="365" fill="#59d9cc" font-size="22" text-anchor="start">已确认的模式与约束</text><text x="1503" y="415" fill="#9bafbe" font-size="18" text-anchor="start">Range</text><text x="1503" y="441" fill="#9bafbe" font-size="16" text-anchor="start">每点完整字节数由用户填写</text><text x="1503" y="480" fill="#9bafbe" font-size="18" text-anchor="start">全 Hist</text><text x="1503" y="506" fill="#9bafbe" font-size="16" text-anchor="start">旁路DSP，输出片内累计计数</text><text x="1503" y="545" fill="#9bafbe" font-size="18" text-anchor="start">Echo</text><text x="1503" y="571" fill="#9bafbe" font-size="16" text-anchor="start">回波数 × 窗口宽度：上限预算</text><text x="1503" y="610" fill="#9bafbe" font-size="18" text-anchor="start">优选架构</text><text x="1503" y="636" fill="#9bafbe" font-size="16" text-anchor="start">固定A采集 / B处理，可配其他方式</text><text x="1503" y="675" fill="#9bafbe" font-size="18" text-anchor="start">资源阻塞</text><text x="1503" y="701" fill="#9bafbe" font-size="16" text-anchor="start">FIFO满时背压；不默认丢数据</text><line x1="1503" y1="737" x2="1834" y2="737" stroke="#293a49" stroke-width="0.7"/><text x="1503" y="780" fill="#59d9cc" font-size="21" text-anchor="start">本图的演示条件</text><text x="1503" y="819" fill="#9bafbe" font-size="17" text-anchor="start">目标列周期 80 μs；采集 80 μs
A→B搬移 10 μs；A清空 5 μs
DSP处理 100 μs
打包 10 μs；MIPI发送 160 μs
一列完整结果块 1 KiB
FIFO保留整块直至发送完成</text><text x="1503" y="1020" fill="#9bafbe" font-size="16" text-anchor="start">保守释放规则：
结果进入FIFO后才释放缓存B。
B就是DSP整列工作缓存。
A在搬移结束并清空后复用。
搬移期间A/B均占用，不并行改写。
所有耗时仅为示意，后续可配置。</text><text x="45" y="1233" fill="#9bafbe" font-size="17" text-anchor="start">仅更新独立预览。正式网页与真实芯片参数未改变；发送160 μs为人工设定的慢链路场景，不作为CSI-2/D-PHY带宽结论。</text></g></svg>