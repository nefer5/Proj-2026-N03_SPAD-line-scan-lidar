<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320"><rect width="1900" height="1320" fill="#f5f2ed"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="45" y="43" fill="#81998e" font-size="15" text-anchor="start">HARDWARE / RESOURCE DEPENDENCIES</text><text x="45" y="100" fill="#354d56" font-size="34" text-anchor="start">双缓冲乒乓 · 三个 slot 的时间依赖</text><text x="45" y="140" fill="#819389" font-size="19" text-anchor="start">优选：片内 Hist + 片内 DSP + Range 输出；正交依赖线说明 bank 复用与有限 FIFO 背压。</text><rect x="1540" y="45" width="314" height="43" fill="#ede8df" stroke="none" stroke-width="0.7"/><text x="1560" y="73" fill="#937e61" font-size="19" text-anchor="start">设计预览 · 非当前工况结果</text><rect x="45" y="180" width="431" height="112" fill="#fbf9f6" stroke="#e0ddd6" stroke-width="0.7"/><text x="62" y="209" fill="#819189" font-size="17" text-anchor="start">Hist缓冲</text><text x="62" y="248" fill="#465f65" font-size="29" text-anchor="start">A / B</text><text x="62" y="276" fill="#8e9c95" font-size="15" text-anchor="start">两个 bank</text><rect x="500" y="180" width="431" height="112" fill="#fbf9f6" stroke="#e0ddd6" stroke-width="0.7"/><text x="517" y="209" fill="#819189" font-size="17" text-anchor="start">输出FIFO</text><text x="517" y="248" fill="#465f65" font-size="29" text-anchor="start">1 KiB</text><text x="517" y="276" fill="#8e9c95" font-size="15" text-anchor="start">本例只容纳一列结果</text><rect x="955" y="180" width="431" height="112" fill="#fbf9f6" stroke="#e0ddd6" stroke-width="0.7"/><text x="972" y="209" fill="#819189" font-size="17" text-anchor="start">S2采集推迟</text><text x="972" y="248" fill="#465f65" font-size="29" text-anchor="start">30 μs</text><text x="972" y="276" fill="#8e9c95" font-size="15" text-anchor="start">计划160 → 实际190</text><rect x="1410" y="180" width="431" height="112" fill="#fbf9f6" stroke="#e0ddd6" stroke-width="0.7"/><text x="1427" y="209" fill="#819189" font-size="17" text-anchor="start">DSP输出等待</text><text x="1427" y="248"