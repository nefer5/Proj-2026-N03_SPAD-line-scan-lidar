"#d8e9de" stroke="none" stroke-width="0.7"/><text x="1256.1944444444443" y="924" fill="#5c727a" font-size="17" text-anchor="middle">S2</text><line x1="689.875" y1="478" x2="689.875" y2="565" stroke="#acbdb3" stroke-width="0.7"/><line x1="689.875" y1="565" x2="835.5" y2="565" stroke="#b7b9ab" stroke-width="0.7" stroke-dasharray="3 6"/><line x1="835.5" y1="565" x2="835.5" y2="574" stroke="#acbdb3" stroke-width="0.7"/><line x1="851.6805555555555" y1="608" x2="851.6805555555555" y2="639" stroke="#91ad9f" stroke-width="0.7"/><line x1="1110.5694444444443" y1="738" x2="1110.5694444444443" y2="769" stroke="#91ad9f" stroke-width="0.7"/><line x1="1126.75" y1="868" x2="1126.75" y2="899" stroke="#91ad9f" stroke-width="0.7"/><line x1="560.4305555555555" y1="430" x2="560.4305555555555" y2="804" stroke="#638d7c" stroke-width="0.7"/><text x="568.4305555555555" y="415" fill="#638d7c" font-size="16" text-anchor="start">A释放 → S2采集</text><line x1="835.5" y1="574" x2="835.5" y2="934" stroke="#78998a" stroke-width="0.7"/><line x1="1110.5694444444443" y1="574" x2="1110.5694444444443" y2="934" stroke="#78998a" stroke-width="0.7"/><text x="843.5" y="1046" fill="#6d9282" font-size="16" text-anchor="start">FIFO释放 → DSP交付 / 下一任务读入</text><line x1="511.88888888888886" y1="435" x2="560.4305555555555" y2="435" stroke="#c1a664" stroke-width="0.7" stroke-dasharray="3 6"/><text x="504.88888888888886" y="423" fill="#ad9666" font-size="15" text-anchor="start">S2等待30 μs</text><text x="1270" y="1100" fill="#8a9b94" font-size="17" text-anchor="start">时间 / μs</text><text x="68" y="1146" fill="#87988f" font-size="17" text-anchor="start">浅灰 = Hist bank 保留；黄色 = DSP结果等待。MIPI发送完成释放FIFO占位，背压沿依赖向前传播。</text><text x="1503" y="365" fill="#496b60" font-size="22" text-anchor="start">已确认的模式与约束</text><text x="1503" y="415" fill="#728d7d" font-size="18" text-anchor="start">Range</text><text x="1503" y="441" fill="#8a9b91" font-size="16" text-anchor="start">每点完整字节数由用户填写</text><text x="1503" y="480" fill="#728d7d" font-size="18" text-anchor="start">全 Hist</text><text x="1503" y="506" fill="#8a9b91" font-size="16" text-anchor="start">旁路DSP，输出片内累计计数</text><text x="1503" y="545" fill="#728d7d" font-size="18" text-anchor="start">Echo</text><text x="1503" y="571" fill="#8a9b91" font-size="16" text-anchor="start">回波数 × 窗口宽度：上限预算</text><text x="1503" y="610" fill="#728d7d" font-size="18" text-anchor="start">采集架构</text><text x="1503" y="636" fill="#8a9b91" font-size="16" text-anchor="start">单 / 双缓冲可选，优选双缓冲</text><text x="1503" y="675" fill="#728d7d" font-size="18" text-anchor="start">资源阻塞</text><text x="1503" y="701" fill="#8a9b91" font-size="16" text-anchor="start">FIFO满时背压；不默认丢数据</text><line x1="1503" y1="737" x2="1834" y2="737" stroke="#e5e7e0" stroke-width="0.7"/><text x="1503" y="780" fill="#617f70" font-size="21" text-anchor="start">本图的演示条件</text><text x="1503" y="819" fill="#8a9991" font-size="17" text-anchor="start">目标列周期 80 μs；采集 80 μs
Hist访问 10 μs；DSP 100 μs
打包 10 μs；MIPI发送 160 μs
一列完整结果块 1 KiB
FIFO保留整块直至发送完成</text><text x="1503" y="986" fill="#8d9993" font-size="16" text-anchor="start">保守释放规则：
结果进入FIFO后才释放Hist bank。
本例无独立DSP整列输入缓存。
复位耗时取0，仅为依赖演示。
后续可配置释放事件及复位时间。</text><text x="45" y="1233" fill="#8a9991" font-size="17" text-anchor="start">仅更新独立预览。正式网页与真实芯片参数未改变；发送160 μs为人工设定的慢链路场景，不作为CSI-2/D-PHY带宽结论。</text></g></svg>